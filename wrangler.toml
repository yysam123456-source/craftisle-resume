name = "craftisle-resume"
compatibility_date = "2026-06-07"
pages_build_output_dir = "apps/web/dist"

[build]
command = "pnpm install && pnpm --filter web build"

# Cloudflare Pages Functions (for AI proxy)
# Place `functions/` directory at project root
# e.g. functions/api/ai/chat.ts

[vars]
# DEEPEEK_API_KEY should be set via Cloudflare Dashboard > Pages > Settings > Environment variables
