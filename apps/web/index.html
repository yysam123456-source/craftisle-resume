<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#09090B" />
		<meta name="application-name" content="Craftisle Resume" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-title" content="Craftisle Resume" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="description" content="Create a professional resume in minutes with our free resume builder. 12+ ATS-friendly templates, PDF export, and AI-powered suggestions. No sign-up required.">
		<meta name="keywords" content="resume builder, CV maker, free resume, open source, PDF export, online resume" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Craftisle Resume – Free Open-Source Resume Builder" />
		<meta property="og:description" content="Create, update, and share professional resumes for free. Open-source, privacy-friendly, supports PDF export and multiple templates." />
		<meta property="og:url" content="https://resume.craftisle.com" />
		<meta property="og:image" content="https://resume.craftisle.com/opengraph/og-image.png" />
		<meta property="og:site_name" content="Craftisle Resume" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Craftisle Resume – Free Open-Source Resume Builder" />
		<meta name="twitter:description" content="Create, update, and share professional resumes for free. Open-source, privacy-friendly, supports PDF export." />
		<meta name="twitter:image" content="https://resume.craftisle.com/opengraph/og-image.png" />

		<!-- AI / GEO: allow indexing -->
		<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

		<link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="128x128" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="256x256 any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" type="image/png" sizes="180x180 any" />
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

		<title>Craftisle Resume — Free Resume Builder & CV Maker Online</title>
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "SoftwareApplication",
			"name": "Craftisle Resume",
			"applicationCategory": "BusinessApplication",
			"operatingSystem": "Web",
			"description": "Free and open-source resume builder. Create, update, and share professional resumes with PDF export and AI-powered suggestions.",
			"offers": {
				"@type": "Offer",
				"price": "0",
				"priceCurrency": "USD"
			},
			"url": "https://resume.craftisle.com",
			"sameAs": ["https://github.com/craftisle/resume"]
		}
		</script>
	</head>
	<body>
		<div id="app">
			<style>
				.craftisle-loading {
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					min-height: 100vh;
					background: #09090B;
					color: #FAFAFA;
					font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				}
				.craftisle-loading .spinner {
					width: 40px;
					height: 40px;
					border: 3px solid rgba(250, 250, 250, 0.15);
					border-top-color: #FAFAFA;
					border-radius: 50%;
					animation: craftisle-spin 0.8s linear infinite;
				}
				@keyframes craftisle-spin {
					to { transform: rotate(360deg); }
				}
				.craftisle-loading h1 {
					margin-top: 20px;
					font-size: 18px;
					font-weight: 500;
					letter-spacing: 0.02em;
					opacity: 0.8;
				}
			</style>
			<div class="craftisle-loading">
				<div class="spinner"></div>
				<h1>Craftisle Resume</h1>
			</div>
		</div>
		<noscript>
			<!-- Static fallback for AI crawlers and social previews (GEO / SEO) -->
			<header>
				<h1>Craftisle Resume – Free Open-Source Resume Builder</h1>
				<p>
					Craftisle Resume is a free and open-source resume builder that simplifies
					the process of creating, updating, and sharing your professional resume.
					Supports PDF export, multiple templates, real-time preview, and AI-powered content suggestions.
				</p>
			</header>
			<main>
				<section>
					<h2>Features</h2>
					<ul>
						<li>Free and open-source – no subscription required</li>
						<li>Multiple professional templates</li>
						<li>Real-time PDF preview and export</li>
						<li>AI-powered resume suggestions</li>
						<li>Privacy-friendly – your data stays with you</li>
						<li>Supports multiple languages and locales</li>
					</ul>
				</section>
				<section>
					<h2>Get Started</h2>
					<p>
						Create your professional resume in minutes. No registration required for basic features.
						Visit <a href="https://resume.craftisle.com">resume.craftisle.com</a> to start building.
					</p>
				</section>
			</main>
			<footer>
				<p>
					Craftisle Resume is open-source on <a href="https://github.com/craftisle/resume">GitHub</a>.
					Contact: <a href="mailto:admin@craftisle.com">admin@craftisle.com</a>
				</p>
			</footer>
		</noscript>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
