<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C9A7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00E6BF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer diamond -->
  <polygon points="256,56 456,256 256,456 56,256" fill="url(#gemGrad)" stroke="#F8FAFC" stroke-width="6" filter="url(#glow)"/>

  <!-- Inner highlight frame -->
  <polygon points="256,106 406,256 256,406 106,256" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.5"/>

  <!-- Top highlight dot -->
  <circle cx="256" cy="123" r="21" fill="#FFFFFF" opacity="0.7"/>

  <!-- Bottom reflection -->
  <polygon points="256,189 373,256 256,406" fill="#FFFFFF" opacity="0.12"/>
</svg>