<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C9A7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00E6BF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer diamond -->
  <polygon points="128,20 236,128 128,236 20,128" fill="url(#gemGrad)" stroke="#F8FAFC" stroke-width="6" filter="url(#glow)"/>

  <!-- Inner highlight frame -->
  <polygon points="128,48 210,128 128,210 48,128" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.5"/>

  <!-- Top highlight dot -->
  <circle cx="128" cy="60" r="16" fill="#FFFFFF" opacity="0.7"/>

  <!-- Bottom reflection -->
  <polygon points="128,92 194,128 128,210" fill="#FFFFFF" opacity="0.12"/>
</svg>
